# See https://devenv.sh/reference/yaml-options/
inputs:
  llm-agents:
    url: github:numtide/llm-agents.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  vmtest:
    url: file+https://github.com/danobi/vmtest/releases/download/v0.18.0/vmtest-x86_64
    flake: false
