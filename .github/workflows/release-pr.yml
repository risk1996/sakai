name: Release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare the shared version and changelog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true
      - name: Install the locked devenv
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)#devenv"
      - name: Wait for the manually published first release and its stable tag
        id: baseline
        run: devenv shell -- rtk cargo xtask release baseline
      - name: Open or update the release PR without publishing or tagging
        if: steps.baseline.outputs.ready == 'true'
        env:
          GIT_TOKEN: ${{ github.token }}
        run: devenv shell -- rtk release-plz release-pr
