name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this existing version tag (false rehearses checks only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release CI
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate release candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true
      - name: Install the locked devenv
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)#devenv"
      - name: Require a matching stable tag on main and dry-run the upload
        run: devenv shell -- rtk cargo xtask release prepare --tag "$RELEASE_TAG"
      - name: Preserve the checked candidate, checksum, and release notes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  publish-crates:
    name: Publish crates.io
    needs: [checks, prepare]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true
      - name: Install the locked devenv
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)#devenv"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release/
      - name: Repackage before authentication and require identical bytes
        run: devenv shell -- rtk cargo xtask release check --tag "$RELEASE_TAG"
      - name: Check for an identical previously published archive
        id: registry
        run: devenv shell -- rtk cargo xtask release registry-status
      - name: Exchange GitHub OIDC identity for a temporary crates.io token
        if: steps.registry.outputs.needs_publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish only the Rust library
        if: steps.registry.outputs.needs_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: devenv shell -- rtk secretspec run --provider env --profile publish-crates --reason "Publish the approved Sakai release" -- cargo publish --package sakai --locked --config 'registry.global-credential-providers=["cargo:token"]'
      - name: Verify the registry archive matches the checked candidate
        run: devenv shell -- rtk cargo xtask release verify-registry

  announce:
    name: Create GitHub release notes
    needs: [prepare, publish-crates]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true
      - name: Install the locked devenv
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)#devenv"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release/
      - name: Finalize notes after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: devenv shell -- rtk cargo xtask release github-release
