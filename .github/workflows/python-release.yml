name: Python release artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/python-release.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.*'
      - 'sakai/**'
      - 'sakai-python/**'
      - 'xtask/**'
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    name: Build and audit PyPI distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up the build and audit tools
        run: |
          rustup update stable --no-self-update
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          python -m pip install 'maturin[zig]==1.15.0' ziglang==0.17.1 twine==7.0.0 abi3audit==0.0.26 check-wheel-contents==0.6.3
          cargo fetch --locked
      - name: Build and audit both portable wheels and the source archive
        run: |
          for architecture in x86_64 aarch64; do
            maturin build --manifest-path sakai-python/Cargo.toml --release --locked \
              --target "$architecture-unknown-linux-gnu" --zig --compatibility manylinux2014 \
              --auditwheel check --interpreter "$(command -v python)" --out dist
          done
          maturin sdist --manifest-path sakai-python/Cargo.toml --out dist
          cargo run --locked --package xtask -- release prepare-sdist dist/*.tar.gz
          python -m twine check --strict dist/*
          abi3audit --strict dist/*.whl
          check-wheel-contents dist/*.whl
          sha256sum dist/* >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the exact audited archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test installed Python ${{ matrix.python-version }} on ${{ matrix.architecture }}
    needs: build
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, aarch64]
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist/
      - name: Exercise the candidate wheel outside the source checkout
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          wheel=(dist/*-cp311-abi3-manylinux_2_17_"$ARCHITECTURE".manylinux2014_"$ARCHITECTURE".whl)
          test "${#wheel[@]}" -eq 1
          test -f "${wheel[0]}"
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install --no-deps "${wheel[0]}"
          cd "$RUNNER_TEMP"
          wheel/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/sakai-python/tests"
      - name: Rebuild the source archive with its shipped lockfile
        if: matrix.architecture == 'x86_64' && matrix.python-version == '3.11'
        run: |
          rustup update stable --no-self-update
          python -m pip install maturin==1.15.0
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/sakai-*
          maturin build --manifest-path sakai-python/Cargo.toml --release --locked \
            --interpreter "$(command -v python)" --out "$RUNNER_TEMP/rebuilt"
          cd "$RUNNER_TEMP"
          python -m venv source-wheel
          source-wheel/bin/python -m pip install --no-deps rebuilt/*.whl
          source-wheel/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/sakai-python/tests"
