name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      vmtest_debug:
        description: Retain the full VM console and enable vmtest debug logs
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes:
    name: Kubernetes resources through Python
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"
      - name: Assert Pod resources using the installed Python bindings
        run: devenv tasks run check:kubernetes

  python:
    name: Python ${{ matrix.python-version }} wheel and sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Exercise the minimum and newest runtime for the cp311-abi3 wheel.
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # Prefer stable 3.15, falling back until GitHub publishes its build.
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"
      - name: Build Linux wheel and source distribution
        run: |
          python_executable="$(command -v python)"
          # The hosted interpreter must not load Nix's newer libpython/glibc.
          devenv --profile python shell -- env -u LD_LIBRARY_PATH PYO3_PYTHON="$python_executable" maturin build --manifest-path sakai-python/Cargo.toml --interpreter "$python_executable" --locked --out dist
          devenv --profile python shell -- maturin sdist --manifest-path sakai-python/Cargo.toml --out dist
          compgen -G 'dist/*-cp311-abi3-*.whl'
      - name: Test installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sakai-wheel"
          "$RUNNER_TEMP/sakai-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sakai-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/sakai-python/tests"
      - name: Rebuild and test installed source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sakai-sdist"
          "$RUNNER_TEMP/sakai-sdist/bin/python" -m pip install --no-cache-dir dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sakai-sdist/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/sakai-python/tests"

  checks:
    name: Tests and lints
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7

      # https://devenv.sh/integrations/github-actions/
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Cache Nix store and fetch metadata
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-
          paths: ~/.cache/nix

      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"

      # Keep workspace artifacts as well as dependencies. New commits save a
      # fresh snapshot, reusing the closest dependency/toolchain match first.
      - name: Cache Cargo downloads and compiled targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-

      - name: Check dependency licenses
        run: devenv tasks run check:licenses

      - name: Run Rust and Python checks
        run: devenv --profile python test

  build-live-test:
    name: Build Linux live test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      kernels: ${{ steps.matrix.outputs.kernels }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"
      - name: Cache Cargo downloads and compiled targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-
      - name: Build and stage host test and wrapper
        run: |
          devenv shell -- cargo build --locked --package xtask
          devenv shell -- ./target/debug/xtask build-live-test
          cp target/debug/xtask tests/.cache/sakai-vmtest/bin/xtask
          ldd tests/.cache/sakai-vmtest/bin/linux_live
      - name: Select kernel matrix from the Rust fixture definitions
        id: matrix
        env:
          KERNEL_PROFILE: ${{ github.event_name == 'schedule' && 'full' || 'smoke' }}
        run: |
          kernels=$(devenv shell -- ./target/debug/xtask kernel-matrix --profile "$KERNEL_PROFILE")
          echo "kernels=$kernels" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-live-host-binaries
          path: tests/.cache/sakai-vmtest/bin/
          retention-days: 2

  kernels:
    name: Linux ${{ matrix.kernel }}
    runs-on: ubuntu-26.04
    needs: build-live-test
    timeout-minutes: 10
    env:
      VMTEST_CONSOLE_MAX_BYTES: '1048576'
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.build-live-test.outputs.kernels) }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"

      - name: Download host binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-live-host-binaries
          path: tests/.cache/sakai-vmtest/bin

      - name: Check KVM and executable permissions
        run: |
          test -r /dev/kvm && test -w /dev/kvm || { echo 'KVM unavailable: runner must permit access to /dev/kvm' >&2; exit 1; }
          chmod +x tests/.cache/sakai-vmtest/bin/linux_live tests/.cache/sakai-vmtest/bin/xtask

      - name: Test cgroup v2 against Linux ${{ matrix.kernel }}
        shell: bash
        env:
          SAKAI_VMTEST_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.vmtest_debug || 'false' }}
        run: |
          set -o pipefail
          if [[ "$SAKAI_VMTEST_DEBUG" == true ]]; then export RUST_LOG=vmtest=debug; fi
          devenv shell -- ./tests/.cache/sakai-vmtest/bin/xtask vmtest --kernel "${{ matrix.kernel }}" --test-binary tests/.cache/sakai-vmtest/bin/linux_live 2>&1 | tee vmtest-console.log

      - name: Retain bounded failure console
        if: failure()
        run: |
          if [[ "${{ github.event_name }}" != workflow_dispatch || "${{ inputs.vmtest_debug }}" != true ]]; then
            if [[ -f vmtest-console.log ]] && (( $(wc -c < vmtest-console.log) > VMTEST_CONSOLE_MAX_BYTES )); then
              half=$((VMTEST_CONSOLE_MAX_BYTES / 2))
              head -c "$half" vmtest-console.log > vmtest-failure.log
              tail -c "$half" vmtest-console.log >> vmtest-failure.log
              mv vmtest-failure.log vmtest-console.log
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.vmtest_debug)
        with:
          name: vmtest-console-${{ matrix.kernel }}
          path: vmtest-console.log
          if-no-files-found: ignore
          retention-days: 2
