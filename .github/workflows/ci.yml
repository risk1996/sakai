name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7

      # https://devenv.sh/integrations/github-actions/
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Cache Nix store and fetch metadata
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-
          paths: ~/.cache/nix

      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"

      # Keep workspace artifacts as well as dependencies. New commits save a
      # fresh snapshot, reusing the closest dependency/toolchain match first.
      - name: Cache Cargo downloads and compiled targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-

      - name: Run formatting, Clippy, tests, and doctests
        run: devenv test

  kernels:
    name: Linux ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(github.event_name == 'schedule' && '["5.15","6.1","6.6","6.12","6.18"]' || '["5.15","6.18"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore kernels and BoxLite Cargo artifacts
        id: vmtest-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tests/.cache/sakai-vmtest/kernels
            tests/.cache/sakai-vmtest/cargo
            tests/.cache/sakai-vmtest/target
          key: boxlite-v3-${{ matrix.kernel }}-${{ hashFiles('Cargo.lock', 'devenv.nix', 'tools/vmtest/**', 'xtask/**') }}-${{ github.sha }}
          restore-keys: |
            boxlite-v3-${{ matrix.kernel }}-${{ hashFiles('Cargo.lock', 'devenv.nix', 'tools/vmtest/**', 'xtask/**') }}-
            boxlite-v3-${{ matrix.kernel }}-

      - uses: cachix/install-nix-action@v31

      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"

      - name: Allow BoxLite to use KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      # Ubuntu 24.04's default AppArmor policy blocks BoxLite's bundled
      # bubblewrap from creating the user namespace used by its jailer.
      - name: Allow BoxLite to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Linux ${{ matrix.kernel }} with BoxLite boot drivers
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}" --build-kernel

      - name: Inspect Linux ${{ matrix.kernel }} kernel image and boot drivers
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}" --inspect-kernel

      - name: Save verified kernel build cache
        if: steps.vmtest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            tests/.cache/sakai-vmtest/kernels
            tests/.cache/sakai-vmtest/cargo
            tests/.cache/sakai-vmtest/target
          key: ${{ steps.vmtest-cache.outputs.cache-primary-key }}

      - name: Smoke-test BoxLite's bundled kernel
        env:
          RUST_LOG: boxlite=debug
        run: devenv shell -- vmtest --bundled-kernel-smoke

      - name: Probe Linux ${{ matrix.kernel }} ELF with default kernel arguments
        id: default-probe
        continue-on-error: true
        env:
          RUST_LOG: boxlite=debug
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}" --boot-probe default

      - name: Stage default-probe diagnostics
        if: always()
        run: devenv shell -- vmtest --collect-diagnostics

      - name: Probe Linux ${{ matrix.kernel }} compressed image with default arguments
        id: compressed-probe
        continue-on-error: true
        env:
          RUST_LOG: boxlite=debug
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}" --kernel-image-format compressed --boot-probe default

      - name: Stage compressed-probe diagnostics
        if: always()
        run: devenv shell -- vmtest --collect-diagnostics

      - name: Probe Linux ${{ matrix.kernel }} ELF with verbose kernel output
        id: verbose-probe
        continue-on-error: true
        env:
          RUST_LOG: boxlite=debug
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}" --boot-probe verbose

      - name: Stage verbose-probe diagnostics
        if: always()
        run: devenv shell -- vmtest --collect-diagnostics

      - name: Probe Linux ${{ matrix.kernel }} ELF with serial kernel output
        id: serial-probe
        continue-on-error: true
        env:
          RUST_LOG: boxlite=trace
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}" --boot-probe serial

      - name: Stage serial-probe diagnostics
        if: always()
        run: devenv shell -- vmtest --collect-diagnostics

      - name: Test cgroup v2 against Linux ${{ matrix.kernel }}
        env:
          RUST_LOG: boxlite=debug
        run: devenv shell -- vmtest --kernel "${{ matrix.kernel }}"

      - name: Stage BoxLite diagnostics without traversing rootfs images
        if: always()
        run: devenv shell -- vmtest --collect-diagnostics

      - name: Show BoxLite diagnostics
        if: always()
        run: |
          set +e
          echo "Default probe outcome: ${{ steps.default-probe.outcome }}"
          echo "Compressed probe outcome: ${{ steps.compressed-probe.outcome }}"
          echo "Verbose probe outcome: ${{ steps.verbose-probe.outcome }}"
          echo "Serial probe outcome: ${{ steps.serial-probe.outcome }}"
          ls -lh tests/.cache/sakai-vmtest/kernels/*-v${{ matrix.kernel }}-boxlite
          file tests/.cache/sakai-vmtest/kernels/*-v${{ matrix.kernel }}-boxlite
          readelf -h tests/.cache/sakai-vmtest/kernels/vmlinux-v${{ matrix.kernel }}-boxlite
          readelf -l tests/.cache/sakai-vmtest/kernels/vmlinux-v${{ matrix.kernel }}-boxlite
          id
          uname -a
          ls -l /dev/kvm
          lscpu
          lsmod | grep -E '^(kvm|virtio|vsock)'
          free -h
          df -h .
          ulimit -a
          grep -m1 -E '^(flags|Features)' /proc/cpuinfo
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo dmesg --color=never | tail -n 100
          find tests/.cache/sakai-vmtest/diagnostics/${{ github.run_id }} -type f \
            \( -name 'boxlite.log*' -o -name 'shim.stderr' -o -name 'console.log' -o -name 'exit' \) \
            -printf '%p (%s bytes)\n' -exec tail -n 300 {} \;

      - name: Upload BoxLite boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boxlite-linux-${{ matrix.kernel }}-diagnostics
          path: tests/.cache/sakai-vmtest/diagnostics/${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
