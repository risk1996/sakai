name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      vmtest_debug:
        description: Retain the full VM console and enable vmtest debug logs
        type: boolean
        default: false
  schedule:
    # Weekly on Monday at 03:17 UTC, including the RustSec security checks.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  # A reusable invocation inherits the caller's workflow name. Keep CI's
  # concurrency group distinct from Release to avoid cancelling its caller.
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: RustSec and dependency policy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - name: Audit the lockfile and check dependency policy
        run: devenv tasks run check:security

  kubernetes:
    name: Kubernetes resources through Python
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - name: Assert Pod resources using the installed Python bindings
        run: devenv tasks run check:kubernetes

  python:
    name: Python ${{ matrix.python-version }} wheel and sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Exercise the minimum and newest runtime for the cp311-abi3 wheel.
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # Prefer stable 3.15, falling back until GitHub publishes its build.
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - uses: ./.github/actions/setup-devenv
      - name: Verify generated Python stubs
        run: |
          devenv --profile python tasks run generate:stubs
          git diff --exit-code -- sakai-python/python/sakai
      - name: Build Linux wheel and source distribution
        run: |
          python_executable="$(command -v python)"
          # The hosted interpreter must not load Nix's newer libpython/glibc.
          devenv --profile python shell -- env -u LD_LIBRARY_PATH PYO3_PYTHON="$python_executable" maturin build --manifest-path sakai-python/Cargo.toml --interpreter "$python_executable" --locked --out dist
          devenv --profile python shell -- maturin sdist --manifest-path sakai-python/Cargo.toml --out dist
          compgen -G 'dist/*-cp311-abi3-*.whl'
      - name: Test installed wheel and rebuilt source distribution outside checkout
        run: |
          for extension in whl tar.gz; do
            venv="$RUNNER_TEMP/sakai-$extension"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --no-cache-dir dist/*."$extension"
            devenv --profile python shell -- rtk env -u LD_LIBRARY_PATH uv pip install --python "$venv/bin/python" --group sakai-python/pyproject.toml:test
            (cd "$RUNNER_TEMP" && "$venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/sakai-python/tests" && "$venv/bin/python" -m mypy.stubtest sakai --ignore-disjoint-bases --allowlist "$GITHUB_WORKSPACE/sakai-python/tests/stubtest-allowlist.txt")
          done

  checks:
    name: Tests and lints
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-devenv
        with:
          cache-nix: 'true'
          cache-cargo: 'true'

      - name: Run Rust and Python checks
        run: devenv --profile python test

      - name: Read the crate's minimum Rust version
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "sakai")["rust_version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install minimum Rust toolchain
        env:
          RUST_VERSION: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTC=$(rustup which --toolchain "$RUST_VERSION" rustc)" >> "$GITHUB_ENV"
          echo "RUSTDOC=$(rustup which --toolchain "$RUST_VERSION" rustdoc)" >> "$GITHUB_ENV"
      - name: Test all crate targets and features on MSRV
        env:
          RUST_VERSION: ${{ steps.msrv.outputs.version }}
        run: rustup run "$RUST_VERSION" cargo test -p sakai --all-targets --all-features --locked
      - name: Test crate documentation on MSRV
        env:
          RUST_VERSION: ${{ steps.msrv.outputs.version }}
        run: rustup run "$RUST_VERSION" cargo test -p sakai --doc --all-features --locked

  build-live-test:
    name: Build Linux live test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      kernels: ${{ steps.matrix.outputs.kernels }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
        with:
          cache-cargo: 'true'
      - name: Build and stage host test and wrapper
        run: |
          devenv shell -- cargo build --locked --package xtask
          devenv shell -- ./target/debug/xtask build-live-test
          cp target/debug/xtask tests/.cache/sakai-vmtest/bin/xtask
          ldd tests/.cache/sakai-vmtest/bin/linux_live
      - name: Select kernel matrix from the Rust fixture definitions
        id: matrix
        env:
          KERNEL_PROFILE: ${{ github.event_name == 'schedule' && 'full' || 'smoke' }}
        run: |
          kernels=$(devenv shell -- ./target/debug/xtask kernel-matrix --profile "$KERNEL_PROFILE")
          echo "kernels=$kernels" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-live-host-binaries
          path: tests/.cache/sakai-vmtest/bin/
          retention-days: 2

  kernels:
    name: Linux ${{ matrix.kernel }}
    runs-on: ubuntu-26.04
    needs: build-live-test
    timeout-minutes: 10
    env:
      VMTEST_CONSOLE_MAX_BYTES: '1048576'
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.build-live-test.outputs.kernels) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-devenv
        with:
          binary-cache: 'false'

      - name: Download host binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-live-host-binaries
          path: tests/.cache/sakai-vmtest/bin

      - name: Check KVM and executable permissions
        run: |
          test -r /dev/kvm && test -w /dev/kvm || { echo 'KVM unavailable: runner must permit access to /dev/kvm' >&2; exit 1; }
          chmod +x tests/.cache/sakai-vmtest/bin/linux_live tests/.cache/sakai-vmtest/bin/xtask

      - name: Cache the versioned kernel fixture
        uses: actions/cache@v6
        with:
          path: tests/.cache/sakai-vmtest/kernels/bzImage-v${{ matrix.kernel }}-archlinux
          key: vmtest-kernel-v1-x86_64-${{ matrix.kernel }}-${{ hashFiles('xtask/src/vmtest/kernel.rs') }}

      - name: Test cgroup v2 against Linux ${{ matrix.kernel }}
        shell: bash
        env:
          SAKAI_VMTEST_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.vmtest_debug || 'false' }}
        run: |
          set -o pipefail
          if [[ "$SAKAI_VMTEST_DEBUG" == true ]]; then export RUST_LOG=vmtest=debug; fi
          devenv shell -- ./tests/.cache/sakai-vmtest/bin/xtask vmtest --kernel "${{ matrix.kernel }}" --test-binary tests/.cache/sakai-vmtest/bin/linux_live 2>&1 | tee vmtest-console.log

      - name: Retain bounded failure console
        if: failure()
        run: |
          if [[ "${{ github.event_name }}" != workflow_dispatch || "${{ inputs.vmtest_debug }}" != true ]]; then
            if [[ -f vmtest-console.log ]] && (( $(wc -c < vmtest-console.log) > VMTEST_CONSOLE_MAX_BYTES )); then
              half=$((VMTEST_CONSOLE_MAX_BYTES / 2))
              head -c "$half" vmtest-console.log > vmtest-failure.log
              tail -c "$half" vmtest-console.log >> vmtest-failure.log
              mv vmtest-failure.log vmtest-console.log
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.vmtest_debug)
        with:
          name: vmtest-console-${{ matrix.kernel }}
          path: vmtest-console.log
          if-no-files-found: ignore
          retention-days: 2
