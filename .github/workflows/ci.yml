name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vmtest_debug:
        description: Retain the full VM console and enable vmtest debug logs
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7

      # https://devenv.sh/integrations/github-actions/
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Cache Nix store and fetch metadata
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-
          paths: ~/.cache/nix

      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"

      # Keep workspace artifacts as well as dependencies. New commits save a
      # fresh snapshot, reusing the closest dependency/toolchain match first.
      - name: Cache Cargo downloads and compiled targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-

      - name: Run formatting, Clippy, tests, and doctests
        run: devenv test

  build-live-test:
    name: Build Linux live test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"
      - name: Cache Cargo downloads and compiled targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix', '.github/workflows/ci.yml') }}-
      - name: Build and stage host test and wrapper
        run: |
          devenv shell -- cargo build --locked --package xtask
          devenv shell -- ./target/debug/xtask build-live-test
          cp target/debug/xtask tests/.cache/sakai-vmtest/bin/xtask
          ldd tests/.cache/sakai-vmtest/bin/linux_live
      - uses: actions/upload-artifact@v4
        with:
          name: linux-live-host-binaries
          path: tests/.cache/sakai-vmtest/bin/
          retention-days: 2

  kernels:
    name: Linux ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    needs: build-live-test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(github.event_name == 'schedule' && '["5.15","6.1","6.6","6.12","6.18"]' || '["5.15","6.18"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Install devenv from the locked nixpkgs revision
        run: |
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
          nix profile add "github:NixOS/nixpkgs/$nixpkgs_rev#devenv"

      - name: Download host binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-live-host-binaries
          path: tests/.cache/sakai-vmtest/bin

      - name: Check KVM and executable permissions
        run: |
          test -r /dev/kvm && test -w /dev/kvm || { echo 'KVM unavailable: runner must permit access to /dev/kvm' >&2; exit 1; }
          chmod +x tests/.cache/sakai-vmtest/bin/linux_live tests/.cache/sakai-vmtest/bin/xtask

      - name: Test cgroup v2 against Linux ${{ matrix.kernel }}
        shell: bash
        env:
          SAKAI_VMTEST_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.vmtest_debug || 'false' }}
        run: |
          set -o pipefail
          if [[ "$SAKAI_VMTEST_DEBUG" == true ]]; then export RUST_LOG=vmtest=debug; fi
          devenv shell -- ./tests/.cache/sakai-vmtest/bin/xtask vmtest --kernel "${{ matrix.kernel }}" --test-binary tests/.cache/sakai-vmtest/bin/linux_live 2>&1 | tee vmtest-console.log

      - name: Retain bounded failure console
        if: failure()
        run: |
          if [[ "${{ github.event_name }}" != workflow_dispatch || "${{ inputs.vmtest_debug }}" != true ]]; then
            if [[ -f vmtest-console.log ]] && (( $(wc -c < vmtest-console.log) > 1048576 )); then
              head -c 524288 vmtest-console.log > vmtest-failure.log
              tail -c 524288 vmtest-console.log >> vmtest-failure.log
              mv vmtest-failure.log vmtest-console.log
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.vmtest_debug)
        with:
          name: vmtest-console-${{ matrix.kernel }}
          path: vmtest-console.log
          if-no-files-found: ignore
          retention-days: 2
