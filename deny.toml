[graph]
# Include every target, workspace member, and development dependency.
all-features = true

[advisories]
# Vulnerabilities and notices are errors by default. Check informational
# advisories in transitive dependencies as well as direct dependencies.
unmaintained = "all"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
# RustPython's Unicode tables are used by the stub derive macro and the opt-in
# generator, not linked into the normal extension. These notices concern
# maintenance, with no available upgrade; retain all other advisory checks.
ignore = [
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0090", # unic-emoji-char
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

[[licenses.exceptions]]
# Mozilla's root certificate data is distributed under this permissive data license.
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# RustPython's build-time hashing dependency is dedicated to the public domain.
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# RustPython uses Unicode's older data license through this parser dependency.
crate = "unicode_names2"
allow = ["Apache-2.0", "MIT", "Unicode-DFS-2016"]

[bans]
# Transitive dependencies can legitimately require different major versions.
multiple-versions = "warn"
wildcards = "deny"
# Internal unpublished crates use workspace path dependencies without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
