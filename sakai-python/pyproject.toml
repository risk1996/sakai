[project]
name = "sakai"
version = "0.1.0"
description = "Read-only Linux cgroup v2 metrics"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "sakai._sakai"
bindings = "pyo3"
