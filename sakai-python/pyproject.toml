[project]
name = "sakai"
dynamic = ["version"]
description = "Read-only Linux cgroup metrics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Source = "https://github.com/risk1996/sakai"
Documentation = "https://github.com/risk1996/sakai/tree/main/sakai-python"
Issues = "https://github.com/risk1996/sakai/issues"
Changelog = "https://github.com/risk1996/sakai/blob/main/sakai/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed package layout: the final component must match the #[pymodule] name.
# https://www.maturin.rs/project_layout
python-source = "python"
module-name = "sakai._sakai"
bindings = "pyo3"

[dependency-groups]
test = ["mypy>=2.4,<3"]
