[project]
name = "sakai"
dynamic = ["version"]
description = "Read-only Linux cgroup v2 metrics"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed package layout: the final component must match the #[pymodule] name.
# https://www.maturin.rs/project_layout
python-source = "python"
module-name = "sakai._sakai"
bindings = "pyo3"
