[package]
name = "sakai-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_sakai"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
# The regular CPython ABI floor matches requires-python in pyproject.toml.
# Maturin sets PYO3_BUILD_EXTENSION_MODULE only for extension builds; enabling
# PyO3's deprecated extension-module feature here would interfere with Rust tests.
# https://pyo3.rs/v0.29.2/building-and-distribution
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
sakai = { path = "../sakai" }
uom.workspace = true

[dev-dependencies]
assertables.workspace = true
