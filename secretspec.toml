[project]
name = "sakai"
revision = "1.0"

# Shell entry, builds, and tests need no publishing credentials.
[profiles.default]
CARGO_REGISTRY_TOKEN = { description = "Optional publishing token; development does not require it", required = false }

# CD supplies a temporary OIDC token through the env provider. Local bootstrap
# uses Cargo's native macOS Keychain credential provider instead.
[profiles.publish-crates]
CARGO_REGISTRY_TOKEN = { description = "Temporary crates.io publishing token", required = true }
