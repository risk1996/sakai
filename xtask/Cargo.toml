[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.100"
boxlite = "0.10.2"
clap = { version = "4.5.48", features = ["derive"] }
flate2 = "1"
futures = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
