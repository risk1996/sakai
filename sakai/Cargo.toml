[package]
name = "sakai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only Linux cgroup v2 metrics with portable parsers and typed snapshots"
repository = "https://github.com/risk1996/sakai"
readme = "README.md"
keywords = ["cgroup", "linux", "metrics", "resources", "monitoring"]
categories = ["os::linux-apis", "parsing"]

[lints]
workspace = true

[dependencies]
nutype = "0.8.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
uom.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "std"] }

[dev-dependencies]
assertables.workspace = true
indoc = "2.0.8"
tempfile.workspace = true
