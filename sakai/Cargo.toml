[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
assertables.workspace = true
indoc = "2.0.7"
