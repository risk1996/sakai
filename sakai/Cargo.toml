[package]
name = "sakai"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nutype = "0.8.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
