[package]
name = "sakai-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
nutype = "0.7.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
uom = { version = "0.38.0", default-features = false, features = ["f64", "u64", "si"] }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }

[dev-dependencies]
assertables = "10.1.0"
indoc = "2.0.7"
